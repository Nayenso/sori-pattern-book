        function getVocabForQuestion(q) {
            const patternItems = patternVocab[q.pattern] || [];
            const sentenceItems = sentenceVocab[q.id] || [];
            const seen = new Set();
            const merged = [];

            [...sentenceItems, ...patternItems].forEach(item => {
                const key = item.word.toLowerCase();
                if (!seen.has(key)) {
                    seen.add(key);
                    merged.push(item);
                }
            });

            return merged.slice(0, 5);
        }

        function renderVocabHtml(vocab) {
            if (!vocab.length) return '';
            return `
                <div class="mt-3 pt-3 border-t border-indigo-100">
                    <p class="text-xs font-semibold text-indigo-600 mb-2">📖 핵심 단어 · 숙어</p>
                    <ul class="space-y-1.5">
                        ${vocab.map(v => `
                            <li class="text-sm leading-relaxed">
                                <span class="font-semibold text-slate-800">${v.word}</span>
                                <span class="text-slate-500 font-mono text-xs ml-1">${v.ipa}</span>
                                <span class="text-slate-600"> — ${v.meaning}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;
        }

        const WRONG_COUNT_STORAGE_KEY = `soriPatternBookWrongCounts:${document.title}`;
        const STUDY_COUNT_STORAGE_KEY = `soriPatternBookStudyCounts:${document.title}`;
        let questions = rawData.map((item, idx) => ({ ...item, id: idx, wrongCount: 0, studyCount: 0 }));
        loadWrongCounts();
        loadStudyCounts();
        let currentDisplayList = [...questions];
        let currentMode = "all";

        function loadWrongCounts() {
            try {
                const saved = JSON.parse(localStorage.getItem(WRONG_COUNT_STORAGE_KEY) || '{}');
                questions.forEach(q => {
                    if (saved[q.id] !== undefined) {
                        q.wrongCount = Math.max(0, Number(saved[q.id]) || 0);
                    }
                });
            } catch (e) {
                console.warn('틀린 횟수 저장 데이터를 불러오지 못했습니다.', e);
            }
        }

        function saveWrongCounts() {
            const counts = {};
            questions.forEach(q => {
                if (q.wrongCount > 0) counts[q.id] = q.wrongCount;
            });
            localStorage.setItem(WRONG_COUNT_STORAGE_KEY, JSON.stringify(counts));
        }


        function loadStudyCounts() {
            try {
                const saved = JSON.parse(localStorage.getItem(STUDY_COUNT_STORAGE_KEY) || '{}');
                questions.forEach(q => {
                    if (saved[q.id] !== undefined) {
                        q.studyCount = Math.max(0, Number(saved[q.id]) || 0);
                    }
                });
            } catch (e) {
                console.warn('학습 횟수 저장 데이터를 불러오지 못했습니다.', e);
            }
        }

        function saveStudyCounts() {
            const counts = {};
            questions.forEach(q => {
                if (q.studyCount > 0) counts[q.id] = q.studyCount;
            });
            localStorage.setItem(STUDY_COUNT_STORAGE_KEY, JSON.stringify(counts));
        }


        function speakQuestion(id) {
            const q = questions.find(item => item.id === id);
            if (!q || !q.en) return;

            if (!('speechSynthesis' in window)) {
                alert('이 브라우저에서는 음성 읽기 기능을 지원하지 않습니다. Chrome 또는 삼성 인터넷으로 열어보세요.');
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(q.en);
            utterance.lang = 'en-US';
            utterance.rate = 0.82;
            utterance.pitch = 1;
            utterance.volume = 1;

            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => 
                v.lang && v.lang.toLowerCase().startsWith('en') &&
                /google|samantha|microsoft|english|us/i.test(v.name)
            ) || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));

            if (preferredVoice) utterance.voice = preferredVoice;

            window.speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        let wrongSortOrder = "original";

        function setInitialStatus() {
            const status = document.getElementById('filter-status');
            if (status) status.innerText = `현재 상태: 전체 항목 보기 (총 ${questions.length}문장)`;
        }

        function sortWrongList(list, order) {
            const copied = [...list];
            if (order === "desc") {
                copied.sort((a, b) => (b.wrongCount - a.wrongCount) || (a.id - b.id));
            } else if (order === "asc") {
                copied.sort((a, b) => (a.wrongCount - b.wrongCount) || (a.id - b.id));
            } else {
                copied.sort((a, b) => a.id - b.id);
            }
            return copied;
        }

        function getSortLabel(order) {
            if (order === "desc") return "틀린 횟수 많은 순";
            if (order === "asc") return "틀린 횟수 적은 순";
            return "원래 순서";
        }


        function changeStudyCount(id, amount) {
            const item = questions.find(q => q.id === id);
            if (item) {
                item.studyCount = Math.max(0, (item.studyCount || 0) + amount);
                saveStudyCounts();

                const dashboardPanel = document.getElementById('dashboard-panel');
                if (dashboardPanel && dashboardPanel.classList.contains('visible-text')) showDashboard();

                const label = document.getElementById(`study-counter-val-${id}`);
                if (label) {
                    label.innerText = `학습: ${item.studyCount}회`;
                }
            }
        }

        function changeCount(id, amount) {
            const item = questions.find(q => q.id === id);
            if (item) {
                item.wrongCount = Math.max(0, item.wrongCount + amount);
                saveWrongCounts();
                const dashboardPanel = document.getElementById('dashboard-panel');
                if (dashboardPanel && dashboardPanel.classList.contains('visible-text')) showDashboard(); // refresh dashboard

                const label = document.getElementById(`counter-val-${id}`);
                if (label) {
                    label.innerText = `틀림: ${item.wrongCount}회`;
                    label.className = item.wrongCount >= 5
                        ? "px-3 font-bold text-sm text-rose-600"
                        : "px-3 font-bold text-sm text-slate-700";
                }

                if (currentMode === "wrong") {
                    setTimeout(() => showWrongQuestions(wrongSortOrder), 250);
                }
            }
        }

        function shuffleQuestions() {
            currentMode = "shuffled";
            currentDisplayList = [...currentDisplayList];
            for (let i = currentDisplayList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentDisplayList[i], currentDisplayList[j]] = [currentDisplayList[j], currentDisplayList[i]];
            }
            document.getElementById('filter-status').innerText = `현재 상태: 무작위 순서 섞기 완료 (${currentDisplayList.length}문장)`;
            renderQuestions();
        }

        function showOriginalOrder() {
            currentMode = "all";
            currentDisplayList = [...questions].sort((a, b) => a.id - b.id);
            document.getElementById('filter-status').innerText = `현재 상태: 원래 전체 순서 보기 (총 ${questions.length}문장)`;
            renderQuestions();
        }

        function showWrongQuestions(order = wrongSortOrder) {
            currentMode = "wrong";
            wrongSortOrder = order;

            const select = document.getElementById('wrong-sort-select');
            if (select) select.value = wrongSortOrder;

            const wrongList = questions.filter(q => q.wrongCount >= 1);
            currentDisplayList = sortWrongList(wrongList, wrongSortOrder);

            document.getElementById('filter-status').innerText =
                `현재 상태: ⚠️ 틀린 문장 (${currentDisplayList.length}문장) · 정렬: ${getSortLabel(wrongSortOrder)}`;
            renderQuestions();
        }

        function sortWrongQuestions(order) {
            wrongSortOrder = order;
            showWrongQuestions(wrongSortOrder);
        }

        function resetAllCounts() {
            if (confirm("모든 문장의 학습 횟수와 틀린 횟수 누적 데이터를 초기화하시겠습니까?")) {
                questions.forEach(q => { q.wrongCount = 0; q.studyCount = 0; });
                localStorage.removeItem(WRONG_COUNT_STORAGE_KEY);
                localStorage.removeItem(STUDY_COUNT_STORAGE_KEY);
                if (currentMode === "wrong") {
                    currentDisplayList = [];
                    document.getElementById('filter-status').innerText =
                        `현재 상태: ⚠️ 틀린 문장 (0문장) · 정렬: ${getSortLabel(wrongSortOrder)}`;
                } else {
                    currentMode = "all";
                    currentDisplayList = [...questions].sort((a, b) => a.id - b.id);
                    setInitialStatus();
                }
                renderQuestions();
                if (document.getElementById('dashboard-panel')?.classList.contains('visible-text')) showDashboard();
                alert("학습 횟수와 틀린 횟수가 모두 초기화되었습니다.");
            }
        }

        function toggleElement(id) {
            const el = document.getElementById(id);
            if (el) {
                if (el.classList.contains('hidden-text')) {
                    el.classList.remove('hidden-text');
                    el.classList.add('visible-text');
                } else {
                    el.classList.remove('visible-text');
                    el.classList.add('hidden-text');
                }
            }
        }

        function speakTextById(id) {
            const item = questions.find(q => q.id === id);
            if (!item) return;
            speakText(item.en);
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                alert('이 브라우저에서는 음성 읽기 기능을 지원하지 않습니다. Chrome 또는 삼성 인터넷을 사용해보세요.');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1;
            utterance.volume = 1;
            const voices = window.speechSynthesis.getVoices();
            const englishVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en-us')) || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
            if (englishVoice) utterance.voice = englishVoice;
            window.speechSynthesis.speak(utterance);
        }



        function showDashboard() {
            const total = questions.length;
            const zero = questions.filter(q => q.wrongCount === 0).length;
            const low = questions.filter(q => q.wrongCount >= 1 && q.wrongCount <= 3).length;
            const mid = questions.filter(q => q.wrongCount >= 4 && q.wrongCount <= 9).length;
            const high = questions.filter(q => q.wrongCount >= 10).length;
            const wrongTotal = questions.filter(q => q.wrongCount >= 1).length;
            const maxWrong = questions.reduce((max, q) => Math.max(max, q.wrongCount), 0);
            const totalStudy = questions.reduce((sum, q) => sum + (q.studyCount || 0), 0);
            const completionRate = total ? Math.round((zero / total) * 100) : 0;
            const reviewRate = total ? Math.round((wrongTotal / total) * 100) : 0;

            const content = document.getElementById('dashboard-content');
            if (!content) return;

            content.innerHTML = `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                    <div class="bg-white border border-cyan-100 rounded-xl p-4">
                        <p class="text-xs text-slate-500 mb-1">전체 문장</p>
                        <p class="text-2xl font-bold text-slate-800">${total}</p>
                    </div>
                    <div class="bg-white border border-cyan-100 rounded-xl p-4">
                        <p class="text-xs text-slate-500 mb-1">0회 틀림</p>
                        <p class="text-2xl font-bold text-emerald-600">${zero}</p>
                    </div>
                    <div class="bg-white border border-cyan-100 rounded-xl p-4">
                        <p class="text-xs text-slate-500 mb-1">틀린 문장</p>
                        <p class="text-2xl font-bold text-rose-600">${wrongTotal}</p>
                    </div>
                    <div class="bg-white border border-cyan-100 rounded-xl p-4">
                        <p class="text-xs text-slate-500 mb-1">최대 틀림</p>
                        <p class="text-2xl font-bold text-purple-600">${maxWrong}회</p>
                    </div>
                </div>
                <div class="bg-white border border-cyan-100 rounded-xl p-4 mb-4">
                    <div class="flex justify-between text-xs text-slate-500 mb-2">
                        <span>0회 틀림 비율</span>
                        <span>${completionRate}%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                        <div class="bg-emerald-500 h-3 rounded-full" style="width:${completionRate}%"></div>
                    </div>
                    <p class="text-xs text-slate-500 mt-2">복습 필요 문장 비율: ${reviewRate}% · 누적 학습 횟수: ${totalStudy}회</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <button onclick="filterWrongRange(1,3)" class="bg-white hover:bg-amber-50 border border-amber-200 rounded-xl p-4 text-left transition">
                        <p class="text-sm text-slate-500">1~3회 틀림</p>
                        <p class="text-xl font-bold text-amber-600">${low}문장</p>
                    </button>
                    <button onclick="filterWrongRange(4,9)" class="bg-white hover:bg-orange-50 border border-orange-200 rounded-xl p-4 text-left transition">
                        <p class="text-sm text-slate-500">4~9회 틀림</p>
                        <p class="text-xl font-bold text-orange-600">${mid}문장</p>
                    </button>
                    <button onclick="filterWrongRange(10,9999)" class="bg-white hover:bg-rose-50 border border-rose-200 rounded-xl p-4 text-left transition">
                        <p class="text-sm text-slate-500">10회 이상 틀림</p>
                        <p class="text-xl font-bold text-rose-600">${high}문장</p>
                    </button>
                </div>
            `;

            const panel = document.getElementById('dashboard-panel');
            if (panel) {
                panel.classList.remove('hidden-text');
                panel.classList.add('visible-text');
                panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function closeDashboard() {
            const panel = document.getElementById('dashboard-panel');
            if (panel) {
                panel.classList.remove('visible-text');
                panel.classList.add('hidden-text');
            }
        }

        function filterWrongRange(min, max) {
            currentMode = "wrong";
            currentDisplayList = questions
                .filter(q => q.wrongCount >= min && q.wrongCount <= max)
                .sort((a, b) => (b.wrongCount - a.wrongCount) || (a.id - b.id));
            const label = max >= 9999 ? `${min}회 이상` : `${min}~${max}회`;
            const status = document.getElementById('filter-status');
            if (status) status.innerText = `현재 상태: ${label} 틀린 문장 (${currentDisplayList.length}문장)`;
            renderQuestions();
        }

        let shadowingSpeechRate = parseFloat(localStorage.getItem("shadowingSpeechRate") || "0.8");
        let practiceMode = localStorage.getItem("practiceMode") || "shadowing";
        let shadowingList = [];
        let shadowingIndex = 0;
        let shadowingActive = false;
        let shadowingTimer = null;


        function changeShadowingSpeed(value) {
            shadowingSpeechRate = parseFloat(value);
            localStorage.setItem("shadowingSpeechRate", shadowingSpeechRate.toString());

            const guide = document.getElementById('shadowing-guide');
            if (guide && shadowingActive) {
                guide.innerText = `쉐도잉 음성 속도가 ${shadowingSpeechRate}x로 변경되었습니다. 다음 재생부터 적용됩니다.`;
            }
        }

        function syncShadowingSpeedSelect() {
            const select = document.getElementById('shadowing-speed-select');
            if (select) {
                select.value = shadowingSpeechRate.toString();
            }
        }

        function changePracticeMode(value) {
            practiceMode = value || "shadowing";
            localStorage.setItem("practiceMode", practiceMode);
            renderShadowingSentence();
            const guide = document.getElementById('shadowing-guide');
            if (guide) {
                guide.innerText = practiceMode === "opic"
                    ? "OPIC 모드: 한국어를 보고 먼저 영어로 말한 뒤 정답 보기를 누르세요."
                    : "쉐도잉 모드: 먼저 듣고, 음성이 끝나면 따라 말해보세요.";
            }
        }

        function syncPracticeModeSelect() {
            const select = document.getElementById('practice-mode-select');
            if (select) select.value = practiceMode;
        }

        function showOpicAnswer() {
            if (!shadowingList.length) {
                startShadowingMode();
                return;
            }
            const q = shadowingList[shadowingIndex];
            if (!q) return;
            const en = document.getElementById('shadowing-en');
            const guide = document.getElementById('shadowing-guide');
            if (en) en.innerText = q.en;
            if (guide) guide.innerText = '정답을 듣고 바로 따라 말해보세요.';
            speakForShadowing(q.en, () => startShadowingCountdown(5));
        }

        function closeShadowingPanel() {
            stopShadowingMode();
            const panel = document.getElementById('shadowing-panel');
            if (panel) {
                panel.classList.remove('visible-text');
                panel.classList.add('hidden-text');
            }
        }


        function getShadowingSourceList() {
            const list = currentDisplayList && currentDisplayList.length ? currentDisplayList : questions;
            return [...list];
        }

        function showShadowingPanel() {
            const panel = document.getElementById('shadowing-panel');
            if (panel) {
                panel.classList.remove('hidden-text');
                panel.classList.add('visible-text');
                panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function startShadowingMode() {
            shadowingList = getShadowingSourceList();
            if (!shadowingList.length) {
                alert('쉐도잉할 문장이 없습니다. 전체 문장 보기 또는 틀린 문장 보기에서 다시 시도해보세요.');
                return;
            }
            shadowingIndex = 0;
            shadowingActive = true;
            showShadowingPanel();
            renderShadowingSentence();
            playCurrentShadowing();
        }

        function renderShadowingSentence() {
            const q = shadowingList[shadowingIndex];
            const total = shadowingList.length;
            const status = document.getElementById('shadowing-status');
            const kr = document.getElementById('shadowing-kr');
            const en = document.getElementById('shadowing-en');
            const guide = document.getElementById('shadowing-guide');
            if (!q) return;
            if (status) status.innerText = `${practiceMode === "opic" ? "OPIC" : "쉐도잉"} · 문장 ${shadowingIndex + 1} / ${total}`;
            if (kr) kr.innerText = q.kr;
            if (en) en.innerText = practiceMode === "opic" ? "영어로 먼저 말해본 뒤 [정답 보기]를 눌러보세요." : q.en;
            if (guide) {
                guide.innerText = practiceMode === "opic"
                    ? '한국어를 보고 먼저 영어로 말해보세요. 필요하면 정답 보기를 누르세요.'
                    : '먼저 듣고, 음성이 끝나면 5초 동안 바로 따라 말해보세요.';
            }
        }

        function playCurrentShadowing() {
            if (!shadowingActive || !shadowingList.length) {
                startShadowingMode();
                return;
            }
            const q = shadowingList[shadowingIndex];
            if (!q) return;
            clearTimeout(shadowingTimer);
            renderShadowingSentence();

            if (practiceMode === "opic") {
                const guide = document.getElementById('shadowing-guide');
                if (guide) guide.innerText = 'OPIC 모드: 한국어를 보고 먼저 영어로 말해보세요. 10초 후 다음 문장으로 넘어갑니다.';
                startShadowingCountdown(10);
            } else {
                speakForShadowing(q.en, () => startShadowingCountdown(5));
            }
        }

        function speakForShadowing(text, onEnd) {
            if (!('speechSynthesis' in window)) {
                alert('이 브라우저에서는 음성 읽기 기능을 지원하지 않습니다. Chrome 또는 삼성 인터넷으로 열어보세요.');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = shadowingSpeechRate;
            utterance.pitch = 1;
            utterance.volume = 1;
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v =>
                v.lang && v.lang.toLowerCase().startsWith('en') &&
                /google|samantha|microsoft|english|us/i.test(v.name)
            ) || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
            if (preferredVoice) utterance.voice = preferredVoice;
            utterance.onend = () => { if (shadowingActive && typeof onEnd === 'function') onEnd(); };
            window.speechSynthesis.speak(utterance);
        }

        function startShadowingCountdown(seconds) {
            const guide = document.getElementById('shadowing-guide');
            let remain = seconds;
            const tick = () => {
                if (!shadowingActive) return;
                if (guide) guide.innerText = `🎤 지금 따라 말해보세요. ${remain}초 후 다음 문장으로 넘어갑니다.`;
                if (remain <= 0) {
                    nextShadowingSentence();
                    return;
                }
                remain -= 1;
                shadowingTimer = setTimeout(tick, 1000);
            };
            tick();
        }

        function nextShadowingSentence() {
            if (!shadowingActive || !shadowingList.length) return;
            clearTimeout(shadowingTimer);
            if (shadowingIndex >= shadowingList.length - 1) {
                const guide = document.getElementById('shadowing-guide');
                if (guide) guide.innerText = '✅ 쉐도잉 완료! 다시 시작하려면 쉐도잉 모드 버튼을 눌러주세요.';
                stopSpeaking();
                shadowingActive = false;
                return;
            }
            shadowingIndex += 1;
            renderShadowingSentence();
            playCurrentShadowing();
        }

        function stopShadowingMode() {
            shadowingActive = false;
            clearTimeout(shadowingTimer);
            stopSpeaking();
            const guide = document.getElementById('shadowing-guide');
            if (guide) guide.innerText = '쉐도잉 모드가 종료되었습니다.';
        }


        setInitialStatus();
        syncShadowingSpeedSelect();
        syncPracticeModeSelect();
        renderQuestions();
</script>
</body>
</html>
