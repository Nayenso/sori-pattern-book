const sentenceVocab = {};
function getVocabForQuestion(q) {
    const patternItems = patternVocab[q.pattern] || [];
    const sentenceItems = sentenceVocab[q.id] || [];
    const seen = new Set(); const merged = [];
    [...sentenceItems, ...patternItems].forEach(item => { const key = item.word.toLowerCase(); if (!seen.has(key)) { seen.add(key); merged.push(item); } });
    return merged.slice(0, 5);
}
function renderVocabHtml(vocab) {
    if (!vocab.length) return '';
    return `<div class="mt-3 pt-3 border-t border-indigo-100"><p class="text-xs font-semibold text-indigo-600 mb-2">📖 핵심 단어 · 숙어</p><ul class="space-y-1.5">${vocab.map(v => `<li class="text-sm leading-relaxed"><span class="font-semibold text-slate-800">${v.word}</span><span class="text-slate-500 font-mono text-xs ml-1">${v.ipa}</span><span class="text-slate-600"> — ${v.meaning}</span></li>`).join('')}</ul></div>`;
}
let questions = rawData.map((item, idx) => ({ ...item, id: idx, wrongCount: 0 }));
let currentDisplayList = [...questions]; let currentMode = "all";
function renderQuestions() {
    const area = document.getElementById('content-area'); area.innerHTML = '';
    if (currentDisplayList.length === 0) { area.innerHTML = `<div class="text-center py-12 bg-white rounded-xl border border-slate-200"><p class="text-slate-500 text-lg">조건에 맞는 문장이 없습니다. 5회 이상 틀린 문장이 아직 없거나 초기화되었습니다.</p></div>`; return; }
    currentDisplayList.forEach((q) => {
        const vocab = getVocabForQuestion(q); const card = document.createElement('div');
        card.className = "bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col md:flex-row gap-4 items-start md:items-center transition-all hover:border-indigo-300";
        if (q.wrongCount >= 5) card.className += " border-rose-300 bg-rose-50/30";
        card.innerHTML = `<div class="flex-1 w-full"><div class="flex items-center gap-2 mb-2"><span class="pattern-badge">Pattern ${q.pattern}</span>${q.wrongCount >= 5 ? '<span class="bg-rose-500 text-white font-bold text-[10px] px-1.5 py-0.5 rounded">집중 복습</span>' : ''}</div><p class="text-base font-semibold text-slate-800">${q.kr}</p></div><div class="w-full md:w-auto flex flex-col sm:flex-row gap-4 items-start sm:items-center md:justify-end"><div class="flex items-center bg-slate-100 border border-slate-200 rounded-lg p-1"><button onclick="changeCount(${q.id}, -1)" class="w-7 h-7 bg-white border border-slate-200 text-slate-600 rounded flex items-center justify-center font-bold hover:bg-slate-50 active:scale-95 transition text-xs">-</button><span id="counter-val-${q.id}" class="px-3 font-bold text-sm ${q.wrongCount >= 5 ? 'text-rose-600' : 'text-slate-700'}">틀림: ${q.wrongCount}회</span><button onclick="changeCount(${q.id}, 1)" class="w-7 h-7 bg-rose-500 text-white rounded flex items-center justify-center font-bold hover:bg-rose-600 active:scale-95 transition text-xs">+</button></div><div class="flex-1 sm:flex-initial w-full min-w-[260px] space-y-2"><div class="flex gap-2"><button onclick="toggleElement('hint-${q.id}')" class="flex-1 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 py-1.5 px-3 rounded-lg font-medium transition">💡 힌트 보기</button><button onclick="toggleElement('answer-${q.id}')" class="flex-1 text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-1.5 px-3 rounded-lg font-medium transition">✅ 정답 확인</button></div><div id="hint-${q.id}" class="hidden-text text-sm text-indigo-600 font-mono italic bg-indigo-50/60 p-2 rounded-md border border-indigo-100">${q.hint}</div><div id="answer-${q.id}" class="hidden-text text-base font-bold text-slate-900 border-l-4 border-indigo-500 pl-3 py-1 bg-slate-50/50 p-2 rounded-r-md"><p>${q.en}</p>${renderVocabHtml(vocab)}</div></div></div>`;
        area.appendChild(card);
    });
}
function changeCount(id, amount) { const item = questions.find(q => q.id === id); if (item) { item.wrongCount = Math.max(0, item.wrongCount + amount); const label = document.getElementById(`counter-val-${id}`); if (label) { label.innerText = `틀림: ${item.wrongCount}회`; label.className = item.wrongCount >= 5 ? "px-3 font-bold text-sm text-rose-600" : "px-3 font-bold text-sm text-slate-700"; } if (currentMode === "filtered") setTimeout(() => filterHardQuestions(), 400); } }
function shuffleQuestions() { currentMode = "shuffled"; for (let i = currentDisplayList.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [currentDisplayList[i], currentDisplayList[j]] = [currentDisplayList[j], currentDisplayList[i]]; } document.getElementById('filter-status').innerText = `현재 상태: 무작위 순서 섞기 완료 (${currentDisplayList.length}문장)`; renderQuestions(); }
function showOriginalOrder() { currentMode = "all"; currentDisplayList = [...questions].sort((a, b) => a.id - b.id); document.getElementById('filter-status').innerText = `현재 상태: 원래 전체 순서 보기 (총 ${questions.length}문장)`; renderQuestions(); }
function filterHardQuestions() { currentMode = "filtered"; currentDisplayList = questions.filter(q => q.wrongCount >= 5); document.getElementById('filter-status').innerText = `현재 상태: ⚠️ 5회 이상 틀린 취약 문장만 보기 (${currentDisplayList.length}문장)`; renderQuestions(); }
function resetAllCounts() { if (confirm("모든 문장의 틀린 횟수 누적 데이터를 초기화하시겠습니까?")) { questions.forEach(q => q.wrongCount = 0); if (currentMode === "filtered") currentDisplayList = []; else if (currentMode === "all") currentDisplayList = [...questions].sort((a, b) => a.id - b.id); renderQuestions(); alert("틀린 횟수가 모두 초기화되었습니다."); } }
function toggleElement(id) { const el = document.getElementById(id); if (el) { if (el.classList.contains('hidden-text')) { el.classList.remove('hidden-text'); el.classList.add('visible-text'); } else { el.classList.remove('visible-text'); el.classList.add('hidden-text'); } } }
