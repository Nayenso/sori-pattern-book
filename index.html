<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소리영어 패턴북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-5xl mx-auto">
        <header class="mb-10 text-center bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800 mb-3">소리영어 패턴북</h1>
            <p class="text-slate-600 max-w-xl mx-auto">
                소리영어 패턴북 Unit별 학습기입니다<br>
                패턴 문장 암기, 취약 문장 복습, 핵심 단어·숙어 학습을 한 번에 진행할 수 있습니다.
            </p>
        </header>

        <section class="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm">
            <h2 class="text-lg font-bold text-slate-800 mb-1">유닛 선택</h2>
            <p class="text-sm text-slate-500 mb-6">Unit 29 ~ 55 · 현재 Unit 29, 30, 31 학습 가능</p>

            <div id="unit-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
        </section>

        <footer class="mt-8 text-center text-sm text-slate-400">
           소리영어 패턴북
        </footer>
    </div>

    <script>
        const UNIT_START = 29;
        const UNIT_END = 55;
        // 유닛 30 추가
        const AVAILABLE_UNITS = { 
            29: 'unit29.html',
            30: 'unit30.html',
            31: 'unit31.html'
        };

        const grid = document.getElementById('unit-grid');

        for (let unit = UNIT_START; unit <= UNIT_END; unit++) {
            const link = AVAILABLE_UNITS[unit];
            const el = document.createElement(link ? 'a' : 'div');

            if (link) {
                el.href = link;
                el.className = 'group flex flex-col items-center justify-center gap-1 rounded-xl border-2 border-indigo-200 bg-indigo-50 hover:bg-indigo-100 hover:border-indigo-400 p-5 transition shadow-sm';
                el.innerHTML = `
                    <span class="text-2xl font-bold text-indigo-700 group-hover:text-indigo-800">Unit ${unit}</span>
                    <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">학습 가능</span>
                `;
            } else {
                el.className = 'flex flex-col items-center justify-center gap-1 rounded-xl border border-slate-200 bg-slate-50 p-5 opacity-60 cursor-not-allowed';
                el.innerHTML = `
                    <span class="text-2xl font-bold text-slate-400">Unit ${unit}</span>
                    <span class="text-xs font-medium text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">준비 중</span>
                `;
            }

            grid.appendChild(el);
        }
    </script>
</body>
</html>
